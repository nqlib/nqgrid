[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nqgrid-export-client"
version = "0.1.0"
description = "Python client for nqgrid-export (PDF / XLSX pivot reports): HTTP + subprocess exporters, Pydantic models of the pivot contract, an openpyxl writer and an MCP tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
mcp = ["mcp>=1.2"]
dev = [
  "openpyxl>=3.1",
  "mcp>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "datamodel-code-generator>=0.26",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
nqgrid-export-mcp = "nqgrid_export.mcp_tool:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nqgrid_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: starts the real nqgrid-export (needs node + the built CLI; PDF also needs Chromium)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # × and – in prose are intended

[tool.ruff.lint.per-file-ignores]
"src/nqgrid_export/models.py" = ["E501", "I", "RUF", "UP"]

[tool.ruff.format]
exclude = ["src/nqgrid_export/models.py", "*.md"]  # generated (scripts/generate_models.sh); docs keep aligned comments

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["nqgrid_export"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "jsonschema", "jsonschema.*", "referencing", "referencing.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nqgrid_export.xlsx"]
disallow_untyped_calls = false  # openpyxl ships no type hints

[[tool.mypy.overrides]]
module = ["nqgrid_export.mcp_tool"]
disallow_untyped_decorators = false  # FastMCP / MCPServer is resolved at runtime (mcp 1.x or 2.x)
